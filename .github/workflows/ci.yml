name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests (scoring engine, data layer)
        run: npm test

      - name: Production build
        run: npm run build

      - name: E2E (mobile + desktop layouts)
        run: |
          npx playwright install --with-deps chromium
          npm run test:e2e

      - name: Lighthouse budgets
        env:
          CHROME_PATH: ${{ github.workspace }}/chrome-path
        run: |
          node -e "const {chromium}=require('playwright-core');require('fs').writeFileSync(process.env.CHROME_PATH, chromium.executablePath())"
          export CHROME_PATH=$(cat $CHROME_PATH)
          npm run lhci

      - name: Upload e2e report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
